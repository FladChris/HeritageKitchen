name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag or commit, e.g. 0.1.0
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - SQLite
        - PostgreSQL
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Host and browser
      description: e.g. Unraid 7 on amd64, Chrome on Android, installed app
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant container logs (`docker logs heritagekitchen`). Remove personal data.
      render: text
